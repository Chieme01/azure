---
- name: Bootstrap Kubernetes
  hosts: localhost
  become: yes
  tasks:
    - name: Write kubeadm configuration file
      copy:
        dest: /k8config/kubeadm-config.yaml
        owner: azureuser
        group: azureuser
        content: |
          remove this line, ansible added!
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          nodeRegistration:
            criSocket: unix:///var/run/cri-dockerd.sock
